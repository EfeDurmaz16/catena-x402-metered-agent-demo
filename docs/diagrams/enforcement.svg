<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" role="img" aria-labelledby="title desc">
  <title id="title">Where enforcement lives</title>
  <desc id="desc">Dual enforcement: client bookkeeping vs Catena platform policy, plus authorized to delivered to settled</desc>
  <defs>
    <style>
      .bg { fill: #FAFAF8; }
      .ink { fill: #1A1A1A; }
      .muted { fill: #6B6860; }
      .line { stroke: #C8C5BE; fill: none; stroke-width: 1.25; }
      .arrow { stroke: #C8C5BE; fill: none; stroke-width: 1.25; marker-end: url(#arrow); }
      .arrow-accent { stroke: #0B6E4F; fill: none; stroke-width: 1.5; marker-end: url(#arrow-accent); }
      .box { fill: #FFFFFF; stroke: #C8C5BE; stroke-width: 1.25; }
      .box-soft { fill: #F3F2EE; stroke: #C8C5BE; stroke-width: 1.25; }
      .accent-box { fill: #E8F5F0; stroke: #0B6E4F; stroke-width: 1.75; }
      .refuse { fill: #FFFFFF; stroke: #8A867C; stroke-width: 1.25; stroke-dasharray: 4 3; }
      .accent { fill: #0B6E4F; }
      .label { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12.5px; font-weight: 600; }
      .sub { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; font-weight: 400; }
      .title { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 650; }
      .col-h { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13.5px; font-weight: 650; }
      .tiny { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 10.5px; font-weight: 500; }
      .stage { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 650; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5 L8.5 5 L1 8.5 Z" fill="#C8C5BE"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5 L8.5 5 L1 8.5 Z" fill="#0B6E4F"/>
    </marker>
  </defs>

  <rect class="bg" width="860" height="480" rx="10"/>

  <text class="title ink" x="32" y="40">Where enforcement lives</text>
  <text class="sub muted" x="32" y="58">Two independent layers - client convenience vs platform security boundary</text>
  <line class="line" x1="32" y1="74" x2="828" y2="74"/>

  <rect class="box-soft" x="32" y="92" width="380" height="36" rx="8"/>
  <text class="col-h ink" x="222" y="115" text-anchor="middle">Client bookkeeping</text>

  <rect class="accent-box" x="448" y="92" width="380" height="36" rx="8"/>
  <text class="col-h accent" x="638" y="115" text-anchor="middle">Catena platform</text>

  <!-- Left column -->
  <rect class="box" x="72" y="148" width="300" height="40" rx="7"/>
  <text class="label ink" x="222" y="173" text-anchor="middle">1. Quote unpaid (402 header)</text>

  <path class="arrow" d="M222 188 L222 208"/>

  <rect class="box" x="72" y="210" width="300" height="40" rx="7"/>
  <text class="label ink" x="222" y="235" text-anchor="middle">2. Cap check (bigint micros)</text>

  <path class="arrow" d="M222 250 L222 270"/>

  <rect class="refuse" x="72" y="272" width="300" height="48" rx="7"/>
  <text class="label ink" x="222" y="292" text-anchor="middle">3. Refuse before payment</text>
  <text class="tiny muted" x="222" y="308" text-anchor="middle">when over SPEND_CAP_USD - not the security boundary</text>

  <!-- Right column -->
  <rect class="box" x="488" y="148" width="300" height="40" rx="7"/>
  <text class="label ink" x="638" y="173" text-anchor="middle">Counterparty allowlist - rules</text>

  <path class="arrow-accent" d="M638 188 L638 208"/>

  <rect class="box" x="488" y="210" width="300" height="40" rx="7"/>
  <text class="label ink" x="638" y="235" text-anchor="middle">Approval threshold check</text>

  <path class="arrow-accent" d="M638 250 L638 270"/>

  <rect class="accent-box" x="488" y="272" width="300" height="48" rx="7"/>
  <text class="label accent" x="638" y="292" text-anchor="middle">Pending intent -&gt; human approve</text>
  <text class="tiny muted" x="638" y="308" text-anchor="middle">re-run same command consumes approval</text>

  <path class="line" d="M372 232 L448 232" marker-end="url(#arrow)"/>
  <text class="tiny muted" x="410" y="224" text-anchor="middle">then pay</text>

  <!-- Bottom stages -->
  <text class="label ink" x="32" y="360">Payment truth - three stages</text>

  <rect class="box" x="32" y="376" width="250" height="72" rx="8"/>
  <text class="stage ink" x="157" y="404" text-anchor="middle">Authorized</text>
  <text class="sub muted" x="157" y="424" text-anchor="middle">CLI reports paid - funds reserved</text>

  <path class="arrow" d="M282 412 L312 412"/>

  <rect class="box" x="314" y="376" width="250" height="72" rx="8"/>
  <text class="stage ink" x="439" y="404" text-anchor="middle">Delivered</text>
  <text class="sub muted" x="439" y="424" text-anchor="middle">endpoint result - pay-on-delivery</text>

  <path class="arrow-accent" d="M564 412 L594 412"/>

  <rect class="accent-box" x="596" y="376" width="232" height="72" rx="8"/>
  <text class="stage accent" x="712" y="404" text-anchor="middle">Settled</text>
  <text class="sub muted" x="712" y="424" text-anchor="middle">intents get - tx completed</text>
</svg>
