<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="title desc">
  <title id="title">Stack</title>
  <desc id="desc">Metered agent pays a real x402 endpoint from a Catena account</desc>
  <defs>
    <style>
      .bg { fill: #FAFAF8; }
      .ink { fill: #1A1A1A; }
      .muted { fill: #6B6860; }
      .line { stroke: #C8C5BE; fill: none; stroke-width: 1.25; }
      .arrow { stroke: #C8C5BE; fill: none; stroke-width: 1.25; marker-end: url(#arrow); }
      .arrow-accent { stroke: #0B6E4F; fill: none; stroke-width: 1.5; marker-end: url(#arrow-accent); }
      .box { fill: #FFFFFF; stroke: #C8C5BE; stroke-width: 1.25; }
      .box-soft { fill: #F3F2EE; stroke: #C8C5BE; stroke-width: 1.25; }
      .accent-box { fill: #E8F5F0; stroke: #0B6E4F; stroke-width: 1.75; }
      .accent { fill: #0B6E4F; }
      .label { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12.5px; font-weight: 600; }
      .sub { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; font-weight: 400; }
      .title { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 650; }
      .subtitle { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12.5px; font-weight: 400; }
      .tiny { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 10.5px; font-weight: 500; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5 L8.5 5 L1 8.5 Z" fill="#C8C5BE"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5 L8.5 5 L1 8.5 Z" fill="#0B6E4F"/>
    </marker>
  </defs>

  <rect class="bg" width="860" height="440" rx="10"/>

  <text class="title ink" x="32" y="40">Stack</text>
  <text class="subtitle muted" x="32" y="60">Metered agent pays a real x402 endpoint from a Catena account</text>
  <line class="line" x1="32" y1="76" x2="828" y2="76"/>

  <rect class="box" x="32" y="100" width="140" height="64" rx="8"/>
  <text class="label ink" x="102" y="126" text-anchor="middle">Runner / Agent</text>
  <text class="sub muted" x="102" y="144" text-anchor="middle">quote -&gt; cap check</text>

  <line class="arrow" x1="172" y1="132" x2="204" y2="132"/>

  <rect class="box" x="206" y="100" width="168" height="64" rx="8"/>
  <text class="label ink" x="290" y="122" text-anchor="middle">BlockRun x402</text>
  <text class="sub muted" x="290" y="140" text-anchor="middle">endpoint - 402 challenge</text>
  <text class="tiny muted" x="290" y="154" text-anchor="middle">pay-on-delivery</text>

  <path class="arrow" d="M290 164 L290 196"/>
  <text class="tiny muted" x="304" y="186">402</text>

  <rect class="box-soft" x="206" y="200" width="168" height="64" rx="8"/>
  <text class="label ink" x="290" y="226" text-anchor="middle">catena CLI x402</text>
  <text class="sub muted" x="290" y="244" text-anchor="middle">pays from account</text>

  <line class="arrow-accent" x1="374" y1="232" x2="406" y2="232"/>

  <rect class="accent-box" x="408" y="184" width="220" height="96" rx="8"/>
  <circle cx="428" cy="204" r="4" class="accent"/>
  <text class="label accent" x="518" y="210" text-anchor="middle">Catena policy</text>
  <text class="sub ink" x="518" y="230" text-anchor="middle">payer + policy surface</text>
  <text class="tiny muted" x="518" y="250" text-anchor="middle">allowlist - limits - approval</text>
  <text class="tiny muted" x="518" y="266" text-anchor="middle">threshold -&gt; pending intent</text>

  <line class="arrow-accent" x1="628" y1="232" x2="660" y2="232"/>

  <rect class="box" x="662" y="200" width="166" height="64" rx="8"/>
  <text class="label ink" x="745" y="226" text-anchor="middle">USDC Base Sepolia</text>
  <text class="sub muted" x="745" y="244" text-anchor="middle">on-chain settlement</text>

  <path class="arrow" d="M745 264 L745 300"/>
  <rect class="box" x="408" y="304" width="420" height="56" rx="8"/>
  <text class="label ink" x="618" y="328" text-anchor="middle">Delivery + reconcile</text>
  <text class="sub muted" x="618" y="346" text-anchor="middle">result delivered - catena intents get - status tally</text>

  <path class="line" d="M408 332 L102 332 L102 164" marker-end="url(#arrow)"/>
  <text class="tiny muted" x="120" y="320">next call</text>

  <rect class="box-soft" x="32" y="380" width="796" height="40" rx="8"/>
  <text class="sub muted" x="52" y="404">Catena is the spending account: CLI authorizes, platform policy binds, agent reconciles intents - not a local wallet.</text>
</svg>
